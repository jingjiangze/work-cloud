<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>work-cloud 多账户看板</title>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2130; --panel2: #212a3d; --border: #2c3650;
    --text: #e6eaf2; --muted: #8a94ab; --green: #34d399; --red: #f87171;
    --orange: #fbbf24; --blue: #60a5fa; --gray: #6b7280; --accent: #7c8cf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; padding: 20px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px; flex-wrap: wrap; gap: 10px;
  }
  h1 { font-size: 20px; font-weight: 600; }
  h1 .dot { color: var(--green); }
  .meta { color: var(--muted); font-size: 12px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=date], button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; outline: none;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
  }
  .card h2 { font-size: 13px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
  .user-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .user-name { font-size: 15px; font-weight: 600; }
  .task-row { display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-top: 1px solid var(--border); }
  .task-name { color: var(--muted); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600; }
  .b-success { background: rgba(52,211,153,.15); color: var(--green); }
  .b-fail    { background: rgba(248,113,113,.15); color: var(--red); }
  .b-unknown { background: rgba(251,191,36,.15); color: var(--orange); }
  .b-skip    { background: rgba(107,114,128,.2);  color: var(--gray); }
  .b-running { background: rgba(96,165,250,.15);  color: var(--blue); }
  .b-off     { background: rgba(107,114,128,.15); color: var(--gray); }
  .b-on      { background: rgba(52,211,153,.12); color: var(--green); }
  .msg { color: var(--muted); font-size: 12px; margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 120px; background: var(--panel2);
    border-radius: 10px; padding: 12px; text-align: center; }
  .stat .num { font-size: 22px; font-weight: 700; }
  .stat .lbl { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; }
  .refresh-note { color: var(--muted); font-size: 12px; }
  .spin { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: r 1s linear infinite; vertical-align: -1px; }
  @keyframes r { to { transform: rotate(360deg); } }
  .typechips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 10px; font-size: 12px; }
  .chip b { color: var(--orange); }
  /* —— 账户卡片（Stage 11）—— */
  .acct-card { cursor: pointer; transition: border-color .15s; }
  .acct-card:hover { border-color: var(--accent); }
  .acct-head { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; }
  .acct-name { font-size: 15px; font-weight: 600; }
  .acct-sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .mini-tasks { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini-tasks .badge { font-size: 11px; padding: 2px 8px; }
  .last-run { color: var(--muted); font-size: 12px; margin-top: 10px;
    border-top: 1px solid var(--border); padding-top: 8px; }
  .back-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .kv { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .kv .k { color: var(--muted); min-width: 110px; }
  pre.policy { background: var(--panel2); border-radius: 8px; padding: 10px;
    font-size: 12px; overflow-x: auto; color: var(--text); }
  .daybar { display: flex; gap: 6px; align-items: flex-end; height: 70px;
    padding: 6px 0; }
  .daycol { flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 4px; font-size: 11px; color: var(--muted); }
  .bar { width: 70%; background: var(--panel2); border-radius: 4px 4px 0 0;
    min-height: 3px; position: relative; }
  .bar .seg { position: absolute; bottom: 0; width: 100%; border-radius: 3px; }
  .seg.s-success { background: var(--green); }
  .seg.s-failed  { background: var(--red); }
  .seg.s-unknown { background: var(--orange); }
  .seg.s-skipped { background: var(--gray); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="dot">&#9679;</span> work-cloud 多账户看板</h1>
      <div class="meta">服务器时间: <span id="srv-time">-</span> <span class="refresh-note">| <span class="spin"></span> 每 30 秒自动刷新</span></div>
    </div>
    <div class="controls">
      <button id="back-btn" style="display:none" onclick="backToOverview()">&larr; 返回总览</button>
      <input type="date" id="datepick">
      <button onclick="loadLegacy()">旧数据查询</button>
      <button onclick="location.href='/logout'" title="退出登录">退出</button>
    </div>
  </header>

  <!-- ============ 总览视图 ============ -->
  <div id="overview-view">
    <div class="card">
      <h2>账户总览 <span class="meta" id="acct-date"></span>
        <button class="btn" style="float:right" onclick="showAddModal()">＋ 添加账号</button></h2>
      <div class="stat-row" id="acct-stats"></div>
    </div>

    <div id="add-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99;align-items:center;justify-content:center">
      <div class="card" style="max-width:420px;width:92%;margin:auto">
        <h2>添加工学云账号</h2>
        <div class="meta" style="margin-bottom:10px">将用该账号真实登录工学云验证（约 10~40 秒），通过后自动注册并开启打卡</div>
        <label class="lbl" style="display:block;margin:8px 0 4px">手机号</label>
        <input id="add-phone" type="tel" maxlength="11" placeholder="工学云登录手机号" style="width:100%;box-sizing:border-box;padding:8px">
        <label class="lbl" style="display:block;margin:8px 0 4px">密码</label>
        <input id="add-password" type="password" placeholder="工学云登录密码" style="width:100%;box-sizing:border-box;padding:8px">
        <label class="lbl" style="display:block;margin:8px 0 4px">备注名（可选）</label>
        <input id="add-name" type="text" placeholder="例如：张三" style="width:100%;box-sizing:border-box;padding:8px">
        <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
          <button class="btn" id="add-submit" onclick="submitAdd()">登录并添加</button>
          <button class="btn" onclick="hideAddModal()">取消</button>
          <span id="add-msg" class="meta"></span>
        </div>
      </div>
    </div>

    <div class="grid" id="acct-cards">
      <div class="card empty">加载账户中…</div>
    </div>

    <div id="legacy-section" style="display:none">
      <h2 style="font-size:13px;color:var(--muted);margin:14px 0 10px" id="day-title">旧版数据（per-user 文件）</h2>
      <div class="card" id="stats-card" style="display:none">
        <h2>累计统计</h2>
        <div class="stat-row" id="stats"></div>
      </div>
      <div class="grid" id="users"></div>
      <div class="card" style="margin-top:4px">
        <h2>风险事件 <span class="meta" id="risk-date"></span></h2>
        <div class="typechips" id="risk-chips"></div>
        <div id="risk-table"></div>
      </div>
      <div class="card">
        <h2>执行历史（该日台账）</h2>
        <div id="history-table"></div>
      </div>
    </div>
  </div>

  <!-- ============ 账户详情视图 ============ -->
  <div id="detail-view" style="display:none">
    <div class="card" id="detail-profile"></div>
    <div class="card"><h2>账户操作</h2>
      <div id="detail-actions" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"></div>
      <div style="margin-top:10px">
        <label class="lbl" style="display:block;margin-bottom:4px">任务开关（JSON，留空表示跟随原配置旗标）</label>
        <textarea id="policy-input" rows="3" style="width:100%;max-width:560px;font-family:monospace"
          placeholder='{"checkin": true, "daily_report": false}'></textarea>
        <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
          <button class="btn" onclick="savePolicy()">保存任务开关</button>
          <span id="action-msg" class="meta"></span>
        </div>
      </div>
    </div>
    <div class="card"><h2>今日任务</h2><div id="detail-today"></div></div>
    <div class="card"><h2>最近 7 天</h2><div class="daybar" id="detail-bars"></div>
      <div id="detail-series" style="margin-top:8px"></div></div>
    <div class="card"><h2>最近错误</h2><div id="detail-errors"></div></div>
    <div class="card"><h2>风险事件（近 7 天）</h2><div id="detail-risk"></div></div>
    <div class="card"><h2>报告记录（近 7 天）</h2><div id="detail-reports"></div></div>
  </div>
</div>

<script>
const STATUS_MAP = {
  SUCCESS: ["b-success","成功"], FAILED: ["b-fail","失败"],
  UNKNOWN: ["b-unknown","未知"], SKIPPED: ["b-skip","跳过"],
  RUNNING: ["b-running","执行中"], INIT: ["b-skip","待执行"],
  LOGIN_SUCCESS: ["b-success","成功"], CHECKIN_SUCCESS: ["b-success","成功"],
  REPORT_SUCCESS: ["b-success","成功"],
};
const RISK_LABEL = {
  CAPTCHA_REQUIRED:"验证码出现", CAPTCHA_CIRCUIT_BREAK:"验证码熔断",
  SUBMIT_UNKNOWN:"提交未知", NETWORK_RETRY:"网络重试",
  AUTH_FAILURE:"登录失败", DUPLICATE_PREVENTED:"已防重复",
  SECOND_INSTANCE_BLOCKED:"并发拦截",
  SECOND_ACCOUNT_INSTANCE_BLOCKED:"账户并发拦截",
};

/* ============ Stage 14: 网页添加工学云账号 ============ */
function showAddModal(){
  document.getElementById("add-modal").style.display = "flex";
  actMsg0("");
  setTimeout(()=>document.getElementById("add-phone").focus(), 50);
}
function hideAddModal(){
  document.getElementById("add-modal").style.display = "none";
  document.getElementById("add-msg").textContent = "";
}
function actMsg0(text){
  document.getElementById("add-msg").textContent = text || "";
  document.getElementById("add-msg").style.color = text.startsWith("✓") ? "var(--green)" : "var(--orange)";
}
async function submitAdd(){
  const phone = document.getElementById("add-phone").value.trim();
  const password = document.getElementById("add-password").value;
  const display_name = document.getElementById("add-name").value.trim();
  if (!/^1\d{10}$/.test(phone)) { actMsg0("手机号格式不正确"); return; }
  if (!password) { actMsg0("请输入密码"); return; }
  if (!CSRF) await initCsrf();
  const btn = document.getElementById("add-submit");
  btn.disabled = true; actMsg0("正在真实登录工学云验证（约 10~40 秒，请勿关闭）…");
  try {
    const r = await fetch("/api/accounts/add", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CSRF-Token": CSRF},
      body: JSON.stringify({phone, password, display_name}),
    });
    const body = await r.json();
    if (r.status === 401) { location.href = "/login"; return; }
    if (r.ok) {
      actMsg0("✓ " + (body.message || "添加成功"));
      setTimeout(() => { hideAddModal(); loadAccounts(); }, 1200);
    } else {
      actMsg0(body.error || ("失败(" + r.status + ")"));
    }
  } catch (e) {
    actMsg0("请求失败: " + e.message);
  } finally {
    btn.disabled = false;
    document.getElementById("add-password").value = "";
  }
}

function esc(s){ return String(s??"").replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ============ Stage 12: 受控管理动作 ============ */
let CSRF = "";
async function initCsrf(){
  try { const r = await fetch("/api/csrf"); if (r.ok) CSRF = (await r.json()).csrf; } catch {}
}

async function apiPost(accountId, payload){
  const r = await fetch(`/api/accounts/${accountId}/action`, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-CSRF-Token": CSRF},
    body: JSON.stringify(payload),
  });
  let body = {};
  try { body = await r.json(); } catch {}
  return {code: r.status, ...body};
}

function actMsg(text, ok){
  const el = document.getElementById("action-msg");
  if (el) { el.textContent = text || ""; el.style.color = ok ? "var(--green)" : "var(--red)"; }
}

async function accountAction(accountId, action, extra){
  if (!CSRF) await initCsrf();
  actMsg("执行中…", true);
  const r = await apiPost(accountId, {action, ...(extra||{})});
  if (r.code === 401) { location.href = "/login"; return; }
  if (r.code === 403) { await initCsrf(); actMsg("CSRF 校验失败，已刷新令牌，请重试", false); return; }
  actMsg(r.message || (r.ok ? "成功" : (r.error || "失败")), r.ok === true);
  if (r.ok) showAccountDetail(accountId);  // 刷新档案（启用状态/策略可能已变）
}

function renderActions(p){
  const bar = document.getElementById("detail-actions");
  if (!bar) return;
  bar.innerHTML = `
    <button class="btn" onclick="accountAction('${esc(p.account_id)}','run')">▶ 立即运行</button>
    ${p.enabled
      ? `<button class="btn" onclick="accountAction('${esc(p.account_id)}','disable')">⏸ 停用</button>`
      : `<button class="btn" onclick="accountAction('${esc(p.account_id)}','enable')">✓ 启用</button>`}
    <span class="meta">所有操作经 CSRF 校验并记入审计台账</span>`;
  document.getElementById("policy-input").value =
    p.task_policy ? JSON.stringify(p.task_policy, null, 1) : "";
}

async function savePolicy(){
  const id = decodeURIComponent(location.pathname.split("/").pop() || "");
  if (!id.startsWith("acct_")) return;
  let policy = null;
  const raw = document.getElementById("policy-input").value.trim();
  if (raw) {
    try { policy = JSON.parse(raw); }
    catch (e) { actMsg("任务开关不是合法 JSON: " + e.message, false); return; }
  }
  await accountAction(id, "set_task_policy", {task_policy: policy});
}

function badge(state){
  const [cls, label] = STATUS_MAP[state] || ["b-skip", state||"-"];
  return `<span class="badge ${cls}">${esc(label)}</span>`;
}

/* ============ 账户总览 ============ */
async function loadAccounts(){
  const r = await fetch("/api/accounts");
  if (r.status === 401) { location.href = "/"; return; }
  const data = await r.json();
  document.getElementById("srv-time").textContent = data.server_time;
  document.getElementById("acct-date").textContent = `(${data.date})`;

  const c = data.counts;
  document.getElementById("acct-stats").innerHTML = [
    ["账户总数", c.total], ["启用", c.enabled],
    ["今日成功", c.success, "var(--green)"], ["今日失败", c.failed, "var(--red)"],
    ["UNKNOWN", c.unknown, "var(--orange)"],
    ["最近运行", data.last_run_time || "—"],
  ].map(([l,v,color])=>`<div class="stat"><div class="num" ${color?`style="color:${color}"`:""}>${esc(v)}</div><div class="lbl">${l}</div></div>`).join("");

  const box = document.getElementById("acct-cards");
  if (!data.accounts.length) {
    box.innerHTML = `<div class="card empty">注册表暂无账户（执行一轮后自动建表）</div>`;
    return;
  }
  box.innerHTML = data.accounts.map(a => {
    const mini = a.tasks.length
      ? a.tasks.map(t=>`<span class="badge ${(STATUS_MAP[t.state]||["b-skip",t.state])[0]}" title="${esc(t.message)}">${esc(t.label)}</span>`).join("")
      : `<span class="meta">今日无任务记录</span>`;
    const lr = a.last_run;
    const lastRun = lr
      ? `${esc(lr.started_at)} · ${lr.duration_sec??"-"}s · ${badge(lr.status.toUpperCase())} <span class="meta" title="${esc(lr.run_id)}">${esc(lr.run_id.slice(0,18))}…</span>`
      : "今日未运行";
    const stateBadge = a.enabled
      ? `<span class="badge b-on">启用</span>`
      : `<span class="badge b-off">禁用</span>`;
    return `<div class="card acct-card" onclick="openAccount('${esc(a.account_id)}')">
      <div class="acct-head"><span class="acct-name">${esc(a.display_name)}</span>${stateBadge}</div>
      <div class="acct-sub">${esc(a.account_id)}</div>
      <div class="mini-tasks">${mini}</div>
      <div class="last-run">最近运行: ${lastRun}</div>
    </div>`;
  }).join("");
}

/* ============ 账户详情 ============ */
function openAccount(id){
  history.pushState({acct:id}, "", `/account/${id}`);
  showAccountDetail(id);
}
function backToOverview(){
  history.pushState({}, "", "/");
  toggleView(false);
  loadAccounts();
}
function toggleView(detail){
  document.getElementById("overview-view").style.display = detail ? "none" : "";
  document.getElementById("detail-view").style.display = detail ? "" : "none";
  document.getElementById("back-btn").style.display = detail ? "" : "none";
}

async function showAccountDetail(id){
  toggleView(true);
  const r = await fetch(`/api/accounts/${id}`);
  if (r.status === 401) { location.href = "/"; return; }
  if (r.status === 404) {
    document.getElementById("detail-profile").innerHTML =
      `<div class="empty">账户不存在: ${esc(id)}</div>`; return;
  }
  const d = await r.json();
  document.getElementById("srv-time").textContent = d.server_time;
  const p = d.profile;
  document.getElementById("detail-profile").innerHTML = `
    <h2>账户详情</h2>
    <div class="user-head"><span class="user-name">${esc(p.display_name)}</span>
      ${p.enabled?`<span class="badge b-on">启用</span>`:`<span class="badge b-off">禁用</span>`}</div>
    <div class="kv"><span class="k">account_id</span><span>${esc(p.account_id)}</span></div>
    <div class="kv"><span class="k">配置文件</span><span>${esc(p.config_file)}</span></div>
    <div class="kv"><span class="k">任务开关</span><span>${p.task_policy?esc(JSON.stringify(p.task_policy)):"未设置（跟随原配置旗标）"}</span></div>
    <div class="kv"><span class="k">调度窗口</span><span>${p.schedule_profile?esc(JSON.stringify(p.schedule_profile)):"未设置（使用全局窗口）"}</span></div>`;
  renderActions(p);
  actMsg("");

  const today = d.today;
  document.getElementById("detail-today").innerHTML = (today.tasks.length || today.ledger_runs.length)
    ? (today.tasks.map(t=>`<div class="task-row"><span class="task-name">${esc(t.label)}</span>${badge(t.state)}</div>
        ${t.message?`<div class="msg" title="${esc(t.message)}">${esc(t.message)}</div>`:""}`).join("")
      + (today.ledger_runs.map(run=>`
        <div class="kv"><span class="k">${esc(run.started_at)} ${esc(run.run_id.slice(0,14))}…</span>
        <span>${badge(run.status.toUpperCase())} · ${run.tasks.map(t=>
          `${esc(t.task_type)}${t.verification&&t.verification.verified===true?" ✓":(t.verification&&t.verification.verified===false?" ✗":(t.status==="unknown"?" ?":""))}`).join("，")}</span></div>`).join(""))
    : `<div class="empty">今日未运行</div>`;

  const maxRuns = Math.max(1, ...d.daily_series.map(s=>s.runs));
  document.getElementById("detail-bars").innerHTML = d.daily_series.map(s=>{
    const H = 46;
    const seg = (n, cls, bottom) => n
      ? `<div class="seg ${cls}" style="height:${Math.max(2, n/maxRuns*H)}px;bottom:${bottom}px"></div>` : "";
    const bottomU = Math.max(2, s.success/maxRuns*H);
    const bottomS = bottomU + Math.max(2, s.failed/maxRuns*H);
    return `<div class="daycol">
      <div class="bar" style="height:${H}px">
        ${seg(s.success, "s-success", 0)}
        ${seg(s.failed, "s-failed", bottomU)}
        ${seg(s.unknown, "s-unknown", bottomS)}
      </div><span>${esc(s.date.slice(5))}</span></div>`;
  }).join("");
  document.getElementById("detail-series").innerHTML = `<table><tr><th>日期</th><th>轮次</th><th>成功</th><th>失败</th><th>未知</th><th>跳过</th></tr>` +
    d.daily_series.map(s=>`<tr><td>${esc(s.date)}</td><td>${s.runs}</td>
      <td style="color:var(--green)">${s.success}</td><td style="color:var(--red)">${s.failed}</td>
      <td style="color:var(--orange)">${s.unknown}</td><td>${s.skipped}</td></tr>`).join("") + `</table>`;

  document.getElementById("detail-errors").innerHTML = d.recent_errors.length
    ? `<table><tr><th>日期</th><th>任务</th><th>错误</th><th>run_id</th></tr>` +
      d.recent_errors.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.task_type)}</td>
        <td class="msg" style="max-width:380px;white-space:normal" title="${esc(e.message)}">${esc(e.message)}</td>
        <td class="meta">${esc(e.run_id.slice(0,18))}…</td></tr>`).join("") + `</table>`
    : `<div class="empty">近 7 天无错误 ✓</div>`;

  document.getElementById("detail-risk").innerHTML = d.risk_events.length
    ? `<table><tr><th>日期</th><th>时间</th><th>任务</th><th>事件</th><th>动作</th><th>结果</th></tr>` +
      d.risk_events.map((e,i)=>{
        // 事件无日期字段，按聚合顺序展示；日期从分组还原
        return `<tr><td>${esc(e._date||"")}</td><td>${esc(e.time)}</td><td>${esc(e.task)}</td>
        <td>${RISK_LABEL[e.event_type]||esc(e.event_type)}</td><td>${esc(e.action)}</td>
        <td class="msg" style="max-width:240px" title="${esc(e.result)}">${esc(e.result)}</td></tr>`;}).join("")
      + `</table>`
    : `<div class="empty">近 7 天无风险事件 ✓</div>`;

  document.getElementById("detail-reports").innerHTML = d.reports.length
    ? `<table><tr><th>report_id</th><th>类型</th><th>周期</th><th>生成时间</th><th>提交</th><th>验证</th></tr>` +
      d.reports.map(r=>`<tr><td class="meta">${esc(r.report_id)}</td><td>${esc(r.report_type)}</td>
        <td>${esc(r.period?.key||"-")}</td><td>${esc(r.generated_at)}</td>
        <td>${badge((r.submit_status||"").toUpperCase())}</td>
        <td>${r.verify_status===true?"✓":(r.verify_status===false?"✗":"-")}</td></tr>`).join("") + `</table>`
    : `<div class="empty">近 7 天无报告记录</div>`;
}

/* ============ 旧版数据视图（per-user 文件兼容） ============ */
function renderUsers(state, history){
  const box = document.getElementById("users");
  const histByUser = {};
  (history?.entries||[]).forEach(e => histByUser[e.user] = e);
  const names = new Set([
    ...state.map(s => s.user || (s.userInfo||{}).userId || "?"),
    ...Object.keys(histByUser),
  ]);
  if (!names.size || (names.size===1 && names.has("?"))) {
    box.innerHTML = `<div class="card empty">该日暂无执行记录</div>`; return;
  }
  let html = "";
  names.forEach(u => {
    const st = state.find(s => (s.user || "") === u) || {};
    const tasks = st.tasks || {};
    const h = histByUser[u];
    let rows = "";
    ["login","checkin","daily_report","weekly_report","monthly_report"].forEach(k=>{
      const t = tasks[k];
      if (t) rows += `<div class="task-row">
        <span class="task-name">${esc(k)}</span>
        ${badge(t.state)} </div>
        ${t.message?`<div class="msg" title="${esc(t.message)}">${esc(t.message)}</div>`:""}`;
    });
    if (h) rows += `<div class="task-row">
      <span class="task-name">最近一轮</span>
      <span class="meta">${esc(h.started_at||"")} · ${h.duration_sec??"-"}s</span></div>`;
    html += `<div class="card"><div class="user-head">
      <span class="user-name">${esc(u)}</span>
      <span class="meta">${st.date?esc(st.date):""}</span></div>${rows || '<div class="empty">无任务记录</div>'}</div>`;
  });
  box.innerHTML = html;
}

function renderRisk(risk){
  const events = risk?.events || [];
  const chips = document.getElementById("risk-chips");
  const table = document.getElementById("risk-table");
  document.getElementById("risk-date").textContent = risk?.date ? `(${risk.date})` : "";
  const counts = {};
  events.forEach(e => counts[e.event_type] = (counts[e.event_type]||0)+1);
  chips.innerHTML = events.length
    ? Object.entries(counts).map(([t,n]) =>
        `<span class="chip">${RISK_LABEL[t]||esc(t)} <b>${n}</b></span>`).join("")
    : `<span class="chip" style="color:var(--green)">无风险事件 ✓</span>`;
  table.innerHTML = events.length ? `<table><tr><th>时间</th><th>用户</th><th>任务</th><th>事件</th><th>阶段</th><th>动作</th><th>结果</th></tr>` +
    events.slice(-30).reverse().map(e=>`<tr>
      <td>${esc(e.time)}</td><td>${esc(e.user)}</td><td>${esc(e.task)}</td>
      <td>${RISK_LABEL[e.event_type]||esc(e.event_type)}</td>
      <td>${esc(e.stage)}</td><td>${esc(e.action)}</td>
      <td class="msg" style="max-width:220px" title="${esc(e.result)}">${esc(e.result)}</td></tr>`).join("") +
    `</table>` : `<div class="empty">该日无风险事件</div>`;
}

function renderHistory(history){
  const box = document.getElementById("history-table");
  const entries = history?.entries || [];
  box.innerHTML = entries.length ? `<table><tr><th>用户</th><th>开始</th><th>耗时</th><th>任务结果</th></tr>` +
    entries.map(e=>`<tr><td>${esc(e.user)}</td><td>${esc(e.started_at)}</td>
      <td>${e.duration_sec??"-"}s</td>
      <td>${(e.results||[]).map(r=>
        `${esc(r.task_type)} ${badge(r.status?.toUpperCase?r.status.toUpperCase():r.status)}`
      ).join("<br>")}</td></tr>`).join("") + `</table>`
    : `<div class="empty">该日暂无台账记录</div>`;
}

function renderStats(stats){
  const card = document.getElementById("stats-card");
  if (!stats || !stats.total_runs) { card.style.display = "none"; return; }
  card.style.display = "";
  const items = [
    ["总轮次", stats.total_runs], ["成功", stats.success_runs],
    ["失败", stats.failed_runs], ["未知", stats.unknown_tasks ?? 0],
    ["平均耗时", (stats.avg_duration_sec||0) + "s"], ["覆盖天数", stats.days],
  ];
  document.getElementById("stats").innerHTML = items.map(([l,v])=>
    `<div class="stat"><div class="num">${esc(v)}</div><div class="lbl">${l}</div></div>`).join("");
}

async function loadLegacy(date){
  document.getElementById("legacy-section").style.display = "";
  date = date || document.getElementById("datepick").value;
  const url = date ? `/api/history?date=${date}` : "/api/overview";
  const r = await fetch(url);
  if (r.status === 401) { location.href = "/"; return; }
  const data = await r.json();
  if (date) {
    document.getElementById("day-title").textContent = `旧版数据（${date}）`;
    document.getElementById("users").innerHTML = "";
    renderHistory(data.history);
    renderRisk(data.risk);
    return;
  }
  renderUsers(data.state, data.history);
  renderRisk(data.risk);
  renderHistory(data.history);
  renderStats(data.statistics);
}

/* ============ 路由 ============ */
window.addEventListener("popstate", () => route());
function route(){
  const m = location.pathname.match(/^\/account\/(acct_[A-Za-z0-9]{6,16})$/);
  if (m) { toggleView(true); showAccountDetail(m[1]); }
  else { toggleView(false); loadAccounts(); }
}
initCsrf();

document.getElementById("datepick").addEventListener("change",
  e=>loadLegacy(e.target.value));
route();
setInterval(()=>{ if (!document.getElementById("detail-view").style.display.includes("none"))
    route();
  else if (document.getElementById("legacy-section").style.display.includes("none"))
    loadAccounts();
  else loadLegacy();
}, 30000);
</script>
