version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "19:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      py-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # main.yml 里有第三方 action（delete-workflow-runs），这条专门盯它
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "19:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
