name: _zhs131 probe

# 只读探针：从 Azure runner（DNS/chromium 正常、出口 IP 不同）打知到网关，
# 判断 /gateway/t/** 的 401 是否是「对所有客户端一律门禁」。
# 不携带任何 cookie/token，只打印状态码。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe zhidao gateway
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          B="https://studyservice-api.zhihuishu.com"
          probe() {
            code=$(curl -sS -m 20 -o /tmp/body -w '%{http_code}' -A "$UA" "$@" 2>/dev/null)
            echo "  -> http=$code body=$(head -c 120 /tmp/body | tr -d '\n')"
          }
          echo "[1] POST nonexistent (t namespace)"
          probe -X POST "$B/gateway/t/v1/learning/__nonexistent__"
          echo "[2] GET queryCourse (t namespace)"
          probe "$B/gateway/t/v1/learning/queryCourse"
          echo "[3] POST queryCourse (t namespace)"
          probe -X POST "$B/gateway/t/v1/learning/queryCourse"
          echo "[4] POST gologin (f namespace)"
          probe -X POST "$B/gateway/f/v1/login/gologin"
          echo "[5] DNS"
          getent hosts studyservice-api.zhihuishu.com | head -2
          echo "RESULT_DONE"
