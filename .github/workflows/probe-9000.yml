name: probe-9000
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Network diagnostics
        run: |
          echo "=== Runner Info ==="
          curl -s -m 5 https://api.ipify.org && echo " (public IPv4)"
          curl -s -m 5 https://api64.ipify.org && echo " (public IPv6/preferred)"
          echo
          echo "=== DNS ==="
          dig +short api.moguding.net A 2>/dev/null || nslookup api.moguding.net 2>/dev/null | grep Address
          dig +short api.moguding.net AAAA 2>/dev/null
          echo
          echo "=== TCP 9000 (IPv4 forced) ==="
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/118.190.120.71/9000' && echo "IPv4:9000 OK" || echo "IPv4:9000 FAIL"
          echo
          echo "=== TCP 9000 (hostname, may use IPv6) ==="
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/api.moguding.net/9000' && echo "hostname:9000 OK" || echo "hostname:9000 FAIL"
          echo
          echo "=== TCP 443 (control) ==="
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/118.190.120.71/443' && echo "IPv4:443 OK" || echo "IPv4:443 FAIL"
          echo
          echo "=== curl test (HTTPS 9000) ==="
          curl -4 -s -o /dev/null -w "IPv4 curl: %{http_code} time=%{time_total}s\n" -m 10 https://118.190.120.71:9000/ 2>&1
          curl -s -o /dev/null -w "hostname curl: %{http_code} time=%{time_total}s\n" -m 10 https://api.moguding.net:9000/ 2>&1
