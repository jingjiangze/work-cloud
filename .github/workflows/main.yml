name: "打卡"

on:
  workflow_dispatch:
    inputs:
      type:
        description: "打卡类型：auto=按小时推断，START=上班，END=下班"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - START
          - END
      mode:
        description: "auto=按需申请登记号并推链接；new=强制申请新登记号并推链接；retry=只做一次提交（不推链接）"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - new
          - retry
  # schedule 已于 2026-10-25 停用：GitHub 定时实测延迟 3h57m~4h35m，
  # cron 08:37(北京) 实际 13:12 才启动 ⇒ 上班卡被误判成下班卡。
  # 现由 ECS systemd timer 精确 dispatch（08:25 START / 17:25 END）。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 跨运行状态（幂等门禁 / 台账 / outRegisterNo / 经纬回写）────────────
      # runner 是临时 VM，`data/` 与 `user/` 不持久 ⇒ 本地幂等门禁永远不命中、
      # 304 拿到的登记号跑完即丢。这里用 cache 把它们跨运行带过去。
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            user
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      # 首次运行（或缓存丢失）时，把 secret 里的账号播种成 user/*.json。
      # 之所以不再用 USER 环境变量：ConfigManager 在 env 来源下 path=None，
      # **不回写**，outRegisterNo / 经纬偏移就永远存不下来。
      - name: Seed account config from secret
        env:
          USER_JSON: ${{ secrets.USER }}
        run: |
          python - <<'PY'
          import json, os, sys
          raw = (os.environ.get("USER_JSON") or "").strip()
          existing = [f for f in os.listdir("user")
                      if f.endswith(".json") and not f.startswith("example")] \
              if os.path.isdir("user") else []
          if existing:
              print("已有账号配置，跳过播种:", existing)
              sys.exit(0)
          if not raw:
              sys.exit("secrets.USER 为空，无法播种账号")
          try:
              accounts = json.loads(raw)
          except Exception as exc:
              sys.exit("secrets.USER 不是合法 JSON: %s" % exc)
          if not accounts:
              sys.exit("secrets.USER 为空数组")
          os.makedirs("user", exist_ok=True)
          for i, acc in enumerate(accounts, 1):
              p = os.path.join("user", "acc%d.json" % i)
              with open(p, "w", encoding="utf-8") as fh:
                  json.dump(acc, fh, ensure_ascii=False, indent=2)
              print("seeded", p)
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 单次执行，不再做 3 次 matrix 重试：
      # 原配置在 attempt 1 成功时并不会取消 attempt 2/3（那一步只打日志），
      # 导致**一次 dispatch 可能提交 3 次打卡**，风控暴露翻三倍。
      - name: Run sign in script
        env:
          TZ: Asia/Shanghai
          CHECKIN_TYPE: ${{ github.event.inputs.type }}
          CHECKIN_RETRY_ONLY: ${{ github.event.inputs.mode == 'retry' && '1' || '' }}
          # 一次扫码后把上/下班两张卡都打完（同一登记号）
          CHECKIN_BOTH: ${{ github.event.inputs.mode == 'retry' && '1' || '' }}
          # 一键重试按钮（token 当天有效）
          GX_TRIGGER_SECRET: ${{ secrets.GX_TRIGGER_SECRET }}
          GX_TRIGGER_BASE: http://118.190.106.170
          CHECKIN_FORCE_NEW: ${{ github.event.inputs.mode == 'new' && '1' || '' }}
          # Linux 上 USER 默认是 runner，main.py 会拿它当 JSON 解析并刷一条错误日志；
          # 显式置空让它走 user/*.json 那条路（也是唯一会回写登记号的路径）。
          USER: ""
        run: |
          export PYTHONUNBUFFERED=1
          python main.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            user
          key: state-${{ github.run_id }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            logs
            data
          retention-days: 7
          if-no-files-found: ignore

      - name: Clean up workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 20
