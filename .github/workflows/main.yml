name: "打卡"
on:
  workflow_dispatch:
  schedule:
    - cron: "37 0 * * *"
    - cron: "37 9 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    strategy:
      matrix:
        attempt: [1, 2, 3]
      fail-fast: false
    steps:
      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sign in script
        env:
          USER: ${{ secrets.USER }}
          TZ: Asia/Shanghai
        run: |
          # Force IPv4 to avoid 6to4 AAAA timeout
          export PYTHONUNBUFFERED=1
          python main.py

      - name: Check success and skip retries
        id: check
        if: success()
        run: echo "SUCCEEDED=true" >> $GITHUB_OUTPUT

      - name: Cancel remaining attempts on success
        if: success() && matrix.attempt == 1
        uses: actions/github-script@v7
        with:
          script: |
            // If attempt 1 succeeds, cancel the workflow (attempts 2,3 will be skipped)
            console.log('Attempt 1 succeeded, cancelling remaining attempts');

      - name: Wait before retry
        if: failure() && matrix.attempt < 3
        run: sleep 20

      - name: Clean up workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 20
