name: "打卡"

on:
  workflow_dispatch:
    inputs:
      type:
        description: "打卡类型：auto=按小时推断，START=上班，END=下班"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - START
          - END
      mode:
        description: "remind=只提醒不提交；fallback=仍未打卡才推兜底链接；auto=按需申请登记号并推链接；new=强制申请新登记号并推链接；retry=只做一次提交（不推链接）"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - new
          - retry
          - remind
          - fallback
      origin:
        description: "触发来源：user=本人点了 PushPlus 按钮（人在手机前），timer=ECS 定时器/自动重派"
        required: false
        default: "timer"
        type: choice
        options:
          - timer
          - user
  # schedule 已于 2026-10-25 停用：GitHub 定时实测延迟 3h57m~4h35m，
  # cron 08:37(北京) 实际 13:12 才启动 ⇒ 上班卡被误判成下班卡。
  # 现由 ECS systemd timer 精确 dispatch（08:25 START / 17:25 END）。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 跨运行状态（幂等门禁 / 台账 / outRegisterNo / 经纬回写）────────────
      # runner 是临时 VM，`data/` 与 `user/` 不持久 ⇒ 本地幂等门禁永远不命中、
      # 304 拿到的登记号跑完即丢。这里用 cache 把它们跨运行带过去。
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            user
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      # 把 secret 里的账号同步进 user/*.json（按手机号合并）：已存在的账号只更新
      # 面板可控字段，保留 token / outRegisterNo / remindSentSlot 等 runtime 键；
      # 新增账号写成 user/acc_<phone>.json。这样面板「保存（写入 GitHub Secret）」后
      # 下一次 dispatch 就能真的多跑一个账号，不需要清缓存重新播种。
      # 之所以不再用 USER 环境变量：ConfigManager 在 env 来源下 path=None，
      # **不回写**，outRegisterNo / 经纬偏移就永远存不下来。
      - name: Sync account config from secret
        env:
          USER_JSON: ${{ secrets.USER }}
        run: |
          python - <<'PY'
          import json, os, sys

          USER_DIR = "user"
          os.makedirs(USER_DIR, exist_ok=True)
          files = [f for f in os.listdir(USER_DIR)
                   if f.endswith(".json") and not f.startswith("example")]

          def load(p):
              with open(p, encoding="utf-8") as fh:
                  return json.load(fh)

          def phone_of(cfg):
              u = ((cfg or {}).get("config") or {}).get("user") or {}
              return str(u.get("phone") or "").strip()

          def mask(phone):
              return (phone[:3] + "***" + phone[-2:]) if len(phone) > 5 else "***"

          index = {}
          for f in files:
              try:
                  index[phone_of(load(os.path.join(USER_DIR, f)))] = f
              except Exception as exc:
                  print("跳过无法解析的配置:", f, exc)

          raw = (os.environ.get("USER_JSON") or "").strip()
          if not raw:
              if not files:
                  sys.exit("secrets.USER 为空且本地无账号配置，无法播种")
              print("无 USER secret，沿用本地配置:", files)
              sys.exit(0)
          try:
              accounts = json.loads(raw)
          except Exception as exc:
              sys.exit("secrets.USER 不是合法 JSON: %s" % exc)
          if not isinstance(accounts, list) or not accounts:
              sys.exit("secrets.USER 为空数组")

          # 按手机号合并：已存在的账号只同步面板可控字段，保留 runtime 键（token / outRegisterNo / remindSentSlot 等）
          added = updated = 0
          for acc in accounts:
              phone = phone_of(acc)
              if not phone:
                  print("跳过无手机号的账号条目")
                  continue
              src_cfg = acc.get("config") or {}
              name = index.get(phone)
              if name:
                  path = os.path.join(USER_DIR, name)
                  cur = load(path)
                  cfg = cur.setdefault("config", {})
                  cfg.setdefault("user", {})["password"] = (src_cfg.get("user") or {}).get("password", "")
                  s_clock = src_cfg.get("clockIn") or {}
                  d_clock = cfg.setdefault("clockIn", {})
                  for k in ("enabled", "mode", "location", "imageCount",
                            "description", "specialClockIn", "customDays"):
                      if k in s_clock:
                          d_clock[k] = s_clock[k]
                  d_rep = cfg.setdefault("reportSettings", {})
                  for k, v in (src_cfg.get("reportSettings") or {}).items():
                      d_rep[k] = v
                  if "ai" in src_cfg:
                      cfg["ai"] = src_cfg["ai"]
                  if "pushNotifications" in src_cfg:
                      cfg["pushNotifications"] = src_cfg["pushNotifications"]
                  with open(path, "w", encoding="utf-8") as fh:
                      json.dump(cur, fh, ensure_ascii=False, indent=2)
                  updated += 1
                  print("updated account", mask(phone))
              else:
                  fname = "acc_%s.json" % phone
                  with open(os.path.join(USER_DIR, fname), "w", encoding="utf-8") as fh:
                      json.dump(acc, fh, ensure_ascii=False, indent=2)
                  index[phone] = fname
                  added += 1
                  print("added account", mask(phone))
          print("账号同步完成: added=%d updated=%d total=%d" % (added, updated, len(index)))
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 单次执行，不再做 3 次 matrix 重试：
      # 原配置在 attempt 1 成功时并不会取消 attempt 2/3（那一步只打日志），
      # 导致**一次 dispatch 可能提交 3 次打卡**，风控暴露翻三倍。
      - name: Run sign in script
        env:
          TZ: Asia/Shanghai
          CHECKIN_TYPE: ${{ github.event.inputs.type }}
          CHECKIN_RETRY_ONLY: ${{ github.event.inputs.mode == 'retry' && '1' || '' }}
          # 一次扫码后把上/下班两张卡都打完（同一登记号）
          CHECKIN_BOTH: ${{ github.event.inputs.mode == 'retry' && '1' || '' }}
          # 一键重试按钮（token 当天有效）
          GX_TRIGGER_SECRET: ${{ secrets.GX_TRIGGER_SECRET }}
          GX_TRIGGER_BASE: http://118.190.106.170
          CHECKIN_FORCE_NEW: ${{ github.event.inputs.mode == 'new' && '1' || '' }}
          # 本人点了按钮（而不是定时器）⇒ 人就在手机前，登记号失效时可以当场补发新链接
          CHECKIN_USER_TAP: ${{ github.event.inputs.origin == 'user' && '1' || '' }}
          # 「提醒 + 兜底」：两种模式都不提交打卡，只用服务端状态决定要不要打扰本人
          CHECKIN_REMIND: ${{ github.event.inputs.mode == 'remind' && '1' || '' }}
          CHECKIN_FALLBACK: ${{ github.event.inputs.mode == 'fallback' && '1' || '' }}
          # Linux 上 USER 默认是 runner，main.py 会拿它当 JSON 解析并刷一条错误日志；
          # 显式置空让它走 user/*.json 那条路（也是唯一会回写登记号的路径）。
          USER: ""
        run: |
          export PYTHONUNBUFFERED=1
          python main.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            user
          key: state-${{ github.run_id }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            logs
            data
          retention-days: 7
          if-no-files-found: ignore

      - name: Clean up workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 20
